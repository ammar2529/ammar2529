<html>
<head>

    <script src="../Scripts/jquery-3.4.1.js"></script>
    <script language='javascript' type='text/javascript'>ROOT_PATH = ''; BASE_PATH = "";</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">



    <script src="AsyncWidgets/Scripts/jquery.slim.js"></script>
    <script src="AsyncWidgets/Scripts/jQueryUI/jquery-ui.js" type="text/javascript"></script>
    <script src="AsyncWidgets/Scripts/Custom-Ext.js" type="text/javascript"></script>
    <script src="AsyncWidgets/Scripts/jquery.alphanumeric.js" type="text/javascript"></script>
    <script type="text/javascript" src="../JQuery/Common.js"></script>
    <script src="AsyncWidgets/Scripts/WidgetBase.js" type="text/javascript"></script>
    <script src="AsyncWidgets/Scripts/DataGrid.js" type="text/javascript"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="../../../App_Themes/eForms_Theme/StyleSheets/ResponsiveTable.css" rel="stylesheet" />
    <asp:Literal ID="ltrScrpt" runat="server"></asp:Literal>
</head>
<body>
    <div class="container responsive-tabs">
        <ul class="nav nav-tabs" role="tablist">
            <li class="nav-item">
                <a id="tab-A" href="#pane-A" class="nav-link active" data-bs-toggle="tab" role="tab">–A–</a>
            </li>
            <li class="nav-item">
                <a id="tab-B" href="#pane-B" class="nav-link" data-bs-toggle="tab" role="tab">–B–</a>
            </li>
            <li class="nav-item">
                <a id="tab-C" href="#pane-C" class="nav-link" data-bs-toggle="tab" role="tab">–C–</a>
            </li>
        </ul>

        <div id="content" class="tab-content" role="tablist">
            <div id="pane-A" class="card tab-pane fade show active" role="tabpanel" aria-labelledby="tab-A">
                <div class="card-header" role="tab" id="heading-A">
                    <h5 class="mb-0">
                        <a data-bs-toggle="collapse" href="#collapse-A" aria-expanded="true" aria-controls="collapse-A">
                            Collapsible Group Item A
                        </a>
                    </h5>
                </div>
                <div id="collapse-A" class="collapse show" data-bs-parent="#content" role="tabpanel"
                     aria-labelledby="heading-A">
                    <div class="card-body">
                        [Tab content A]
                    </div>
                </div>
            </div>

            <div id="pane-B" class="card tab-pane fade" role="tabpanel" aria-labelledby="tab-B">
                <div class="card-header" role="tab" id="heading-B">
                    <h5 class="mb-0">
                        <a class="collapsed" data-bs-toggle="collapse" href="#collapse-B" aria-expanded="false"
                           aria-controls="collapse-B">
                            Collapsible Group Item B
                        </a>
                    </h5>
                </div>
                <div id="collapse-B" class="collapse" data-bs-parent="#content" role="tabpanel"
                     aria-labelledby="heading-B">
                    <div class="card-body">
                        [Tab content B]
                    </div>
                </div>
            </div>

            <div id="pane-C" class="card tab-pane fade" role="tabpanel" aria-labelledby="tab-C">
                <div class="card-header" role="tab" id="heading-C">
                    <h5 class="mb-0">
                        <a data-bs-toggle="collapse" href="#collapse-C" aria-expanded="true" aria-controls="collapse-C">
                            Collapsible Group Item C
                        </a>
                    </h5>
                </div>
                <div id="collapse-C" class="collapse" data-bs-parent="#content" role="tabpanel"
                     aria-labelledby="heading-C">
                    <div class="card-body">
                        [Tab content C]
                    </div>
                </div>
            </div>
        </div>
    </div>


</body>
</html>
